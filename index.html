<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약장 위치 찾기 - [보험약]</title>
    <style>
        /* 다크 모드 스타일 설정 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 700px; 
            margin: 20px auto; 
            padding: 0 15px; 
            background: #121212; 
            color: #e0e0e0; 
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; }
        
        .search-box { 
            width: 100%; 
            padding: 15px; 
            font-size: 18px; 
            border: 2px solid #333; 
            border-radius: 10px; 
            box-sizing: border-box; 
            margin-bottom: 20px; 
            outline: none; 
            background: #1e1e1e; 
            color: #ffffff;
        }
        .search-box:focus { border-color: #f1c40f; }
        
        .cabinet-container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }
        .cabinet-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #3498db; 
            border-bottom: 2px solid #333; 
            padding-bottom: 8px; 
        }
        
        /* 5열 그리드 레이아웃 */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .cell { 
            border: 2px solid #333; 
            padding: 15px 5px; 
            text-align: center; 
            border-radius: 6px; 
            background: #2a2a2a;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.2s;
        }
        .cell.empty { border: none; background: transparent; }
        
        /* 검색 시 옅은 노란색 강조 스타일 */
        .cell.highlight { 
            background: #fff59d !important; 
            border-color: #fbc02d !important; 
            color: #000000 !important; 
            transform: scale(1.05); 
            box-shadow: 0 4px 10px rgba(255, 235, 59, 0.3); 
        }
        
        #resultMsg { 
            text-align: center; 
            margin-top: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            min-height: 24px; 
            color: #f1c40f; 
        }
    </style>
</head>
<body>

    <h2>약장 위치 찾기</h2>
    <input type="text" id="searchBox" class="search-box" placeholder="약 번호 입력 (예: 45, 61)..." onkeyup="searchMedicine()">

    <div id="resultMsg"></div>

    <div class="cabinet-container">
        <div class="cabinet-title">[보험약]</div>
        <div class="grid" id="cabinetGrid"></div>
    </div>

    <script>
        const insuranceCabinet = [
            ["61", "42N", "29N", "12N", "63"],
            ["87", "66", "06N", "23N", "60"],
            ["07N", "35N", "18N", "28N", "08N"],
            ["26N", "32N", "24N", "17N", "01N"],
            ["55N", "27N", "45N", "58", "57TB"],
            ["54N", "21N", "20N", "02N", "10N"],
            ["83", "33N", "22N", "70", null],
            ["50N", "37N", "49N", null, null],
            ["15N", "59", null, null, null]
        ];

        function renderGrid(highlightVal = "") {
            const grid = document.getElementById('cabinetGrid');
            grid.innerHTML = '';

            insuranceCabinet.forEach((row) => {
                row.forEach((item) => {
                    const div = document.createElement('div');
                    if (item === null) {
                        div.className = 'cell empty';
                    } else {
                        div.className = 'cell';
                        div.innerText = item;
                        
                        if (highlightVal && item.toLowerCase().includes(highlightVal.toLowerCase())) {
                            div.classList.add('highlight');
                        }
                    }
                    grid.appendChild(div);
                });
            });
        }

        function searchMedicine() {
            const query = document.getElementById('searchBox').value.trim();
            const msg = document.getElementById('resultMsg');

            if (!query) {
                renderGrid("");
                msg.innerText = "";
                return;
            }

            renderGrid(query);

            let foundCount = 0;
            insuranceCabinet.forEach((row) => {
                row.forEach((item) => {
                    if (item && item.toLowerCase().includes(query.toLowerCase())) {
                        foundCount++;
                    }
                });
            });

            if (foundCount > 0) {
                msg.innerText = `🔍 '[보험약]' 약장에서 '${query}'을(를) 찾았습니다!`;
            } else {
                msg.innerText = `❌ 일치하는 약 번호가 없습니다.`;
            }
        }

        // 처음 접속했을 때부터 표가 바로 보이도록 실행
        renderGrid("");
    </script>
</body>
</html>
